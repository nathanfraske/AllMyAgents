[package]
name = "allmyagents-desktop"
# Kept in sync with tauri.conf.json's `version` (which is what the bundler and the
# updater manifest actually use). MSI/WiX rejects semver pre-release suffixes, so
# the ALPHA marker lives only in the git tag (v0.1.4-alpha.5) — every alpha after
# the first must bump this numeric version or the updater has nothing to compare.
version = "0.1.19"
description = "AllMyAgents desktop shell"
authors = ["CEC"]
edition = "2021"
rust-version = "1.77"

# main.rs is a thin shim that calls into this library's `run()`. Naming the lib
# `<pkg>_lib` and building it as staticlib/cdylib keeps parity with the standard
# Tauri 2 template (and its future mobile support); harmless on desktop.
[lib]
name = "allmyagents_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
sha2 = "0.10"

# Auto-updater (docs/alpha-release-plan.md "Auto-updater"). Desktop-only — the
# plugin does not build for mobile targets, which is why it is target-gated here
# and every call site is behind `#[cfg(desktop)]`.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

# POSIX process-group teardown of the hub tree — `kill(-pgid, SIGTERM/SIGKILL)` in
# `kill_hub`, the macOS/Linux stand-in for Windows' `taskkill /T /F`. libc is
# already in the dependency graph via tauri; naming it directly just exposes
# `kill`/`SIG*` on unix targets. Target-gated, so a Windows build never sees it.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_RestartManager",
  "Win32_System_Threading",
  "Win32_System_Com",
  "Win32_UI_Shell",
] }
