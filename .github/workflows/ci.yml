name: Fleet cached full build and tests

# Cross-OS functional gate. Windows is the primary target and macOS is the second release target, so
# both must stay green; Linux is carried as a cheap POSIX canary for the JS half (it catches a
# Windows-ism long before a Mac would, and costs the least runner time of the three).
#
# The gates here are the SAME commands docs/alpha-cut-checklist.md step 3 tells the operator to run
# locally, plus the credential-firewall self-test and a real payload stage. If it is green here, the
# checklist's "green gates" step is already satisfied.
on:
  workflow_dispatch:

permissions:
  contents: read

# Superseded runs on the same branch/PR are cancelled to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------------------------
  # JS/TS gates â€” hub + web. Fast, no Rust toolchain, so it runs on all three OSes.
  # ---------------------------------------------------------------------------------------------
  gates:
    name: js gates (${{ matrix.os }})
    runs-on: ${{ (matrix.os == 'ubuntu-latest' && fromJSON('["self-hosted","Linux","X64","fleet-general-linux"]')) || (matrix.os == 'windows-latest' && fromJSON('["self-hosted","Windows","X64","fleet-general-windows"]')) || (matrix.os == 'macos-latest' && fromJSON('["self-hosted","macOS","X64","fleet-general-macos"]')) }}
    timeout-minutes: 20
    strategy:
      # Never let one OS failing hide the result on the others.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Prepare local Windows tools and resource budget
        if: runner.environment == 'self-hosted' && runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          # Reviewed Windows release prerequisites, installed only inside the disposable VM.
          # Sources: Tauri prerequisites; Microsoft VS2022 component/layout documentation;
          # official Microsoft/PowerShell and cli/cli publisher assets. No signing keys.
          $ErrorActionPreference='Stop';$ProgressPreference='SilentlyContinue'
          if($env:COMPUTERNAME -notin @('LAB-WIN-01','ATC-WIN-01')){throw 'Expected disposable Windows guest'}
          if((Get-Volume -DriveLetter D).FileSystemLabel -ne 'TestFleetCache'){throw 'Unexpected cache volume'}
          & 'C:\actions-runner\fleet\release-v1\setup_windows_git.ps1'
          $tools='D:\TestFleetCache\tools'
          New-Item -ItemType Directory -Path $tools -Force|Out-Null
          [Net.ServicePointManager]::SecurityProtocol=[Net.SecurityProtocolType]::Tls12
          function Get-VerifiedFile([string]$Uri,[string]$Path,[string]$SHA256) {
           if(-not(Test-Path -LiteralPath $Path)) {
            $partial=$Path+'.partial'
            if(Test-Path -LiteralPath $partial){throw 'Prior download evidence exists; inspect before replay'}
            Invoke-WebRequest -UseBasicParsing -Uri $Uri -OutFile $partial
            if((Get-FileHash -LiteralPath $partial -Algorithm SHA256).Hash -ne $SHA256){throw 'Publisher checksum mismatch'}
            Move-Item -LiteralPath $partial -Destination $Path
           }
           if((Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash -ne $SHA256){throw 'Cached publisher checksum mismatch'}
          }
          function Install-Portable([string]$Name,[string]$Uri,[string]$SHA256,[string]$Exe) {
           $archive=Join-Path $tools ($Name+'.zip');$destination=Join-Path $tools $Name
           Get-VerifiedFile $Uri $archive $SHA256
           $marker=Join-Path $destination '.fleet-archive-sha256'
           if(Test-Path -LiteralPath $destination) {
            if(-not(Test-Path -LiteralPath $marker) -or (Get-Content -LiteralPath $marker -Raw).Trim() -ne $SHA256){throw 'Partial portable tool extraction; inspect before replay'}
           } else {
            Expand-Archive -LiteralPath $archive -DestinationPath $destination
            if(-not(Test-Path -LiteralPath (Join-Path $destination $Exe))){throw 'Portable executable missing'}
            [IO.File]::WriteAllText($marker,$SHA256,[Text.UTF8Encoding]::new($false))
           }
           $folder=Split-Path -Parent (Join-Path $destination $Exe)
           $env:Path=$folder+';'+$env:Path
           if($env:GITHUB_PATH){[IO.File]::AppendAllText($env:GITHUB_PATH,$folder+[Environment]::NewLine,[Text.UTF8Encoding]::new($false))}
          }
          Install-Portable 'PowerShell-7.6.6' 'https://github.com/PowerShell/PowerShell/releases/download/v7.6.6/PowerShell-7.6.6-win-x64.zip' '02FE458BE20493FBDF43F61EA20610B811EE6C738AB1676C61B9CFCD1A33C860' 'pwsh.exe'
          Install-Portable 'gh-2.101.0' 'https://github.com/cli/cli/releases/download/v2.101.0/gh_2.101.0_windows_amd64.zip' 'BC6C814367B193CD8E713611D61E36013C0EF843B8F516458FE3EDA039192794' 'bin\gh.exe'
          $gitBin=Join-Path $tools 'PortableGit-2.55.0.5\bin'
          $env:Path=$gitBin+';'+$env:Path
          if($env:GITHUB_PATH){[IO.File]::AppendAllText($env:GITHUB_PATH,$gitBin+[Environment]::NewLine,[Text.UTF8Encoding]::new($false))}
          
          $node=@('C:\actions-runner\externals\node24\bin\node.exe','C:\actions-runner\externals\node20\bin\node.exe') | Where-Object {Test-Path -LiteralPath $_} | Select-Object -First 1
          if(-not $node){throw 'Actions runner Node runtime is missing'}
          $values=& $node --input-type=module -e "import {currentBudget,jobEnvironment} from 'file:///C:/actions-runner/fleet/release-v1/resources_job.mjs';for(const [k,v] of Object.entries(jobEnvironment(currentBudget())))console.log(k+'='+v)"
          if($LASTEXITCODE -ne 0){throw 'Resource budget could not be configured'}
          foreach($line in $values){[IO.File]::AppendAllText($env:GITHUB_ENV,$line+[Environment]::NewLine,[Text.UTF8Encoding]::new($false))}

      - name: Checkout
        uses: actions/checkout@v4

      # UNRESOLVED MERGE MARKERS MUST NEVER REACH A BUILD.
      #
      # This is not hypothetical here. `apps/hub/src/adapters/claude.ts` was committed carrying
      # `<<<<<<< Updated upstream` / `>>>>>>> Stashed changes` while several agents were rebasing over each
      # other in one working tree. It was removed only by accident â€” swept into an unrelated commit, which
      # was itself then dropped in another rebase. Two coincidences separated that file from a release.
      #
      # The consequence is severe and specific: conflict markers in claude.ts are a syntax error, the hub
      # fails to load, and the app installs and then does nothing â€” the exact "hub never spawns" failure
      # that blocked an earlier cut and is miserable to diagnose from the outside, because the installer,
      # the update manifest and the signatures are all perfectly valid.
      #
      # Runs before any setup: it needs nothing but a checkout, and there is no reason to spend a
      # toolchain install discovering the tree was never buildable.
      - name: Reject unresolved merge markers
        shell: bash
        run: |
          # Anchored to line start so ordinary content (a bash heredoc, a diff in a doc, ===== in a table)
          # cannot trip it. Real markers are always at column 0.
          if git grep -nE '^(<{7} |={7}$|>{7} )' -- \
               '*.ts' '*.tsx' '*.svelte' '*.js' '*.mjs' '*.cjs' '*.rs' '*.json' '*.yml' '*.yaml' '*.toml'; then
            echo "::error title=Unresolved merge markers::A tracked source file contains conflict markers. This would ship a build that cannot parse."
            exit 1
          fi
          echo "no unresolved merge markers in tracked source"

      # pnpm is the repo's package manager (pnpm-lock.yaml, packageManager field). action-setup reads
      # the exact version from package.json's `packageManager`, so there is one source of truth.
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      # setup-node's `cache: pnpm` keys the pnpm store on pnpm-lock.yaml â€” the pnpm cache the task asks
      # for. pnpm must already be on PATH (above) for this to resolve the store dir.
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure persistent fleet build cache
        if: runner.environment == 'self-hosted'
        shell: node {0}
        run: |
          'use strict';
          // Persistent inputs and Cargo output; worktrees and test results remain per job.
          const fs = require('node:fs');
          const path = require('node:path');
          
          function cachePlan(env, platform, arch, packageManager) {
            if (env.GITHUB_REPOSITORY !== 'nathanfraske/AllMyAgents' || arch !== 'x64') {
              throw new Error('Unqualified repository or architecture for fleet cache');
            }
            const roots = {win32: 'D:\\TestFleetCache', linux: '/var/cache/test-fleet', darwin: '/Volumes/TestFleetCache'};
            const root = roots[platform];
            const p = platform === 'win32' ? path.win32 : path.posix;
            if (!root || p.normalize(env.RUNNER_TOOL_CACHE || '') !== p.join(root, 'toolcache')) {
              throw new Error('Runner does not advertise the qualified persistent cache');
            }
            if (!/^pnpm@\d+\.\d+\.\d+(?:\+sha(?:224|256|384|512)\.[a-f0-9]+)?$/.test(packageManager || '')) {
              throw new Error('Expected a pinned pnpm packageManager');
            }
            // Linux's mount root is root-owned; registration owns only its user subtree.
            const writableRoot = platform === 'linux' ? p.join(root, 'user') : root;
            const base = p.join(writableRoot, 'build-cache-v1', 'nathanfraske--AllMyAgents', `${platform}-${arch}`);
            return {root, writableRoot, base, values: {
              npm_config_store_dir: p.join(base, 'pnpm-store'),
              npm_config_verify_store_integrity: 'true',
              CARGO_TARGET_DIR: p.join(base, 'cargo-target'),
              FLEET_CACHE_ROOT: base,
            }};
          }
          
          function configure() {
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const plan = cachePlan(process.env, process.platform, process.arch, pkg.packageManager);
            if (!fs.statSync(plan.root).isDirectory()) throw new Error('Cache disk is missing');
            const realRoot = fs.realpathSync(plan.root);
            if (!fs.statSync(plan.writableRoot).isDirectory()) throw new Error('Runner cache directory is missing');
            const writableRelative = path.relative(realRoot, fs.realpathSync(plan.writableRoot));
            if (writableRelative.startsWith('..') || path.isAbsolute(writableRelative)) throw new Error('Runner cache escaped disk');
            fs.accessSync(plan.writableRoot, fs.constants.W_OK);
            for (const folder of [plan.base, plan.values.npm_config_store_dir, plan.values.CARGO_TARGET_DIR]) {
              fs.mkdirSync(folder, {recursive: true});
              const real = fs.realpathSync(folder);
              const relative = path.relative(realRoot, real);
              if (relative.startsWith('..') || path.isAbsolute(relative)) throw new Error('Cache path escaped disk');
            }
            const space = fs.statfsSync(plan.base, {bigint: true});
            const free = space.bavail * space.bsize;
            if (free < 8n * 1024n ** 3n) throw new Error('Persistent cache needs at least 8 GiB free');
            const lines = Object.entries(plan.values).map(([k, v]) => `${k}=${v}\n`).join('');
            if (!process.env.GITHUB_ENV) throw new Error('Actions environment file missing');
            fs.appendFileSync(process.env.GITHUB_ENV, lines, 'utf8');
            console.log(JSON.stringify({event: 'persistent-build-cache', ...plan, packageManager: pkg.packageManager,
              free_bytes: free.toString(), node: process.version, at: new Date().toISOString()}));
          }
          
          module.exports = {cachePlan};
          if (require.main === module) configure();

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Release durability gate policy
        run: node --test scripts/wait-release-verification.test.mjs scripts/macos-installability-policy.test.mjs

      # ---- Hub gate: apps/hub â†’ vitest run + tsc --noEmit --------------------------------------------
      # (package.json scripts: test = "vitest run", typecheck = "tsc --noEmit")
      - name: Hub â€” unit tests (vitest)
        run: pnpm --filter hub test

      - name: Hub â€” typecheck (tsc --noEmit)
        run: pnpm --filter hub typecheck

      # ---- Web gate: apps/web â†’ svelte-check + vitest run + vite build --------------------------------
      - name: Web â€” svelte-check
        run: pnpm --filter web check

      - name: Web â€” unit tests (vitest)
        run: pnpm --filter web test

      # The desktop bundle embeds this build via tauri.conf.json's `frontendDist`, so a broken Vite
      # build breaks the installer, not just the dev server. Cheap, and it also produces the
      # apps/web/dist that the Rust job's tauri-build step validates.
      - name: Web â€” production build (vite)
        run: pnpm --filter web build

      # ---- Packaging gates --------------------------------------------------------------------------
      # 1. Prove the credential firewall still FIRES (synthetic payload seeded with one leak of each
      #    class). Guards docs/alpha-release-plan.md "The landmine"; costs ~2s.
      - name: Bundle â€” credential-firewall self-test
        run: pnpm run bundle:audit

      # 2. Stage the REAL payload. This is the per-OS packaging gate: it compiles the hub, locates the
      #    platform's Node + npm (their layouts differ â€” npm sits next to node.exe on Windows but under
      #    <prefix>/lib/node_modules on macOS/Linux), and runs the credential audit for real. A macOS
      #    packaging regression fails HERE rather than at release time.
      - name: Bundle â€” stage the real hub payload (runs the audit for real)
        run: pnpm run hub:bundle

      # The release also carries a platform-native, vendor-free testbed node. Build and checksum it on
      # every JS matrix host so Windows, macOS, and the Linux canary all prove their own payload shape.
      - name: Bundle â€” stage the lightweight testbed payload
        run: pnpm run testbed:bundle

      - name: Ubuntu remote-node package and installed command qualification
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash -n scripts/install-linux.sh
          node --test scripts/install-linux.test.mjs
          node scripts/package-testbed-linux.mjs
          node scripts/test-linux-testbed.mjs target/linux-testbed/*.deb

      # 3. Prove the graph a USER actually gets works â€” not the one this repo develops against.
      #
      # The repo resolves dependencies with pnpm; the installed app runs plain `npm install` against the
      # staged package.json + package-lock.json. Those two resolvers legitimately choose different
      # transitive peers (observed: Anthropic SDK 0.115.0 under npm vs 0.114.0 under pnpm), so every test
      # above can pass on a graph no user will ever run. That is the same shape as the bug this pinning
      # work exists to fix â€” an untested dependency set reaching users â€” just one level down.
      #
      # So: install from the PAYLOAD exactly as first-run does, then import the two modules that are
      # loaded EAGERLY at hub startup. Both fail during module linking, before the hub can report
      # anything, which is why a broken one presents to a user as "the app just doesn't work".
      - name: Bundle â€” the shipped npm graph installs and imports
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD="apps/desktop/src-tauri/hub-runtime/apps/hub"
          test -f "$PAYLOAD/package-lock.json" || { echo "::error::no package-lock.json in the payload â€” the pin is cosmetic without it"; exit 1; }
          WORK="$(mktemp -d)"
          cp "$PAYLOAD/package.json" "$PAYLOAD/package-lock.json" "$WORK/"
          ( cd "$WORK" && npm install --omit=dev --no-audit --no-fund --loglevel=error )
          cd "$WORK" && node --input-type=module -e "
            const sqlite = (await import('better-sqlite3')).default
            const db = new sqlite(':memory:'); db.prepare('select 1 as x').get(); db.close()
            const sdk = await import('@anthropic-ai/claude-agent-sdk')
            if (typeof sdk.query !== 'function') throw new Error('claude-agent-sdk exports no query()')
            console.log('shipped graph OK â€” native sqlite loaded, SDK imported')
          "
          # Importing the SDK does not prove the installed vendor launchers work. Exercise npm's real
          # per-platform shims too: POSIX relies on symlinks/shebang + executable bits; Windows resolves
          # the generated shell shim to claude.exe / the Codex Node entry point.
          cd "$WORK" && ./node_modules/.bin/claude --version
          cd "$WORK" && ./node_modules/.bin/codex --version

  # ---------------------------------------------------------------------------------------------
  # Rust gate â€” the Tauri shell. Only on the two RELEASE targets: those are the platforms whose
  # binaries we ship, and the shell's platform branches (taskkill vs. POSIX process groups) only exist
  # for them. Adding Linux would mean installing the whole libwebkit2gtk toolchain for a target we do
  # not release, so it is deliberately out.
  # ---------------------------------------------------------------------------------------------
  rust:
    name: tauri shell (${{ matrix.os }})
    runs-on: ${{ (matrix.os == 'ubuntu-latest' && fromJSON('["self-hosted","Linux","X64","fleet-general-linux"]')) || (matrix.os == 'windows-latest' && fromJSON('["self-hosted","Windows","X64","fleet-general-windows"]')) || (matrix.os == 'macos-latest' && fromJSON('["self-hosted","macOS","X64","fleet-general-macos"]')) }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Prepare local Windows tools and resource budget
        if: runner.environment == 'self-hosted' && runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & C:\actions-runner\fleet\release-v1\setup_windows_release.ps1
          $node=@('C:\actions-runner\externals\node24\bin\node.exe','C:\actions-runner\externals\node20\bin\node.exe') | Where-Object {Test-Path -LiteralPath $_} | Select-Object -First 1
          if(-not $node){throw 'Actions runner Node runtime is missing'}
          $values=& $node --input-type=module -e "import {currentBudget,jobEnvironment} from 'file:///C:/actions-runner/fleet/release-v1/resources_job.mjs';for(const [k,v] of Object.entries(jobEnvironment(currentBudget())))console.log(k+'='+v)"
          if($LASTEXITCODE -ne 0){throw 'Resource budget could not be configured'}
          foreach($line in $values){[IO.File]::AppendAllText($env:GITHUB_ENV,$line+[Environment]::NewLine,[Text.UTF8Encoding]::new($false))}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Caches ~/.cargo/registry, ~/.cargo/git and the crate's target/ dir, keyed on Cargo.lock + the
      # toolchain. `workspaces` points at the crate root because it is not at the repo root.

      - name: Configure persistent fleet build cache
        if: runner.environment == 'self-hosted'
        shell: node {0}
        run: |
          'use strict';
          // Persistent inputs and Cargo output; worktrees and test results remain per job.
          const fs = require('node:fs');
          const path = require('node:path');
          
          function cachePlan(env, platform, arch, packageManager) {
            if (env.GITHUB_REPOSITORY !== 'nathanfraske/AllMyAgents' || arch !== 'x64') {
              throw new Error('Unqualified repository or architecture for fleet cache');
            }
            const roots = {win32: 'D:\\TestFleetCache', linux: '/var/cache/test-fleet', darwin: '/Volumes/TestFleetCache'};
            const root = roots[platform];
            const p = platform === 'win32' ? path.win32 : path.posix;
            if (!root || p.normalize(env.RUNNER_TOOL_CACHE || '') !== p.join(root, 'toolcache')) {
              throw new Error('Runner does not advertise the qualified persistent cache');
            }
            if (!/^pnpm@\d+\.\d+\.\d+(?:\+sha(?:224|256|384|512)\.[a-f0-9]+)?$/.test(packageManager || '')) {
              throw new Error('Expected a pinned pnpm packageManager');
            }
            // Linux's mount root is root-owned; registration owns only its user subtree.
            const writableRoot = platform === 'linux' ? p.join(root, 'user') : root;
            const base = p.join(writableRoot, 'build-cache-v1', 'nathanfraske--AllMyAgents', `${platform}-${arch}`);
            return {root, writableRoot, base, values: {
              npm_config_store_dir: p.join(base, 'pnpm-store'),
              npm_config_verify_store_integrity: 'true',
              CARGO_TARGET_DIR: p.join(base, 'cargo-target'),
              FLEET_CACHE_ROOT: base,
            }};
          }
          
          function configure() {
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const plan = cachePlan(process.env, process.platform, process.arch, pkg.packageManager);
            if (!fs.statSync(plan.root).isDirectory()) throw new Error('Cache disk is missing');
            const realRoot = fs.realpathSync(plan.root);
            if (!fs.statSync(plan.writableRoot).isDirectory()) throw new Error('Runner cache directory is missing');
            const writableRelative = path.relative(realRoot, fs.realpathSync(plan.writableRoot));
            if (writableRelative.startsWith('..') || path.isAbsolute(writableRelative)) throw new Error('Runner cache escaped disk');
            fs.accessSync(plan.writableRoot, fs.constants.W_OK);
            for (const folder of [plan.base, plan.values.npm_config_store_dir, plan.values.CARGO_TARGET_DIR]) {
              fs.mkdirSync(folder, {recursive: true});
              const real = fs.realpathSync(folder);
              const relative = path.relative(realRoot, real);
              if (relative.startsWith('..') || path.isAbsolute(relative)) throw new Error('Cache path escaped disk');
            }
            const space = fs.statfsSync(plan.base, {bigint: true});
            const free = space.bavail * space.bsize;
            if (free < 8n * 1024n ** 3n) throw new Error('Persistent cache needs at least 8 GiB free');
            const lines = Object.entries(plan.values).map(([k, v]) => `${k}=${v}\n`).join('');
            if (!process.env.GITHUB_ENV) throw new Error('Actions environment file missing');
            fs.appendFileSync(process.env.GITHUB_ENV, lines, 'utf8');
            console.log(JSON.stringify({event: 'persistent-build-cache', ...plan, packageManager: pkg.packageManager,
              free_bytes: free.toString(), node: process.version, at: new Date().toISOString()}));
          }
          
          module.exports = {cachePlan};
          if (require.main === module) configure();

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tauri-build (the crate's build.rs) validates tauri.conf.json, and `frontendDist` points at
      # apps/web/dist â€” so the web build has to exist before cargo touches the crate.
      - name: Build the web UI (tauri-build validates frontendDist)
        run: pnpm --filter web build

      # Stage the Tauri resource payload too: tauri.conf.json declares `resources: ["hub-runtime/**/*"]`
      # and a missing resource dir is a config-validation failure at build.rs time.
      - name: Stage the hub payload (tauri resource)
        run: pnpm run hub:bundle

      # This is a separate Tauri resource glob. The JS matrix cannot satisfy it for this job because
      # GitHub Actions jobs have isolated workspaces; stage it here before build.rs validates the config.
      - name: Stage the lightweight testbed payload (tauri resource)
        run: pnpm run testbed:bundle

      - name: cargo check
        working-directory: apps/desktop/src-tauri
        run: cargo check --all-targets

      # `-D warnings` makes clippy an actual gate. NOTE for maintainers: `stable` moves, so a toolchain
      # bump can introduce a brand-new lint and fail this step on untouched code. When that happens,
      # fix the finding (preferred) or add a targeted `#[allow(...)]` with a reason â€” do not drop the
      # `-D`, which would silently turn the gate back into advice.
      - name: cargo clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # `--all-targets` above COMPILES the test targets but never runs them, so the crate's unit tests
      # (path canonicalisation, browser profile isolation, navigation policy) were dead weight in CI. It
      # also excludes doctests entirely â€” which is how a doc comment that could not compile sat on main
      # unnoticed: an indented block in a `///` comment is Rust code to rustdoc, and the Windows error
      # message quoted in it parsed as an unterminated character literal.
      - name: cargo test
        if: runner.os != 'Windows'
        working-directory: apps/desktop/src-tauri
        run: cargo test

      # Cargo's standalone Windows test executable does not inherit the manifest
      # embedded by Tauri in the shipped app. Without Common Controls v6,
      # WebView2 imports TaskDialogIndirect before the Rust test harness starts
      # and exits 0xc0000139. Compile the exact lib test, inject only that test
      # artifact with the checked-in manifest, then run it normally.
      - name: cargo test (Windows manifested harness)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: apps/desktop/src-tauri
        run: |
          $messages = @(cargo test --lib --no-run --message-format=json)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tests = @($messages | ForEach-Object { $_ | ConvertFrom-Json } |
            Where-Object { $_.reason -eq 'compiler-artifact' -and $_.profile.test -and $_.executable })
          if ($tests.Count -ne 1) { throw "Expected one exact Cargo library test executable" }
          $testExe = Get-Item -LiteralPath $tests[0].executable
          $mt = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter mt.exe |
            Where-Object { $_.FullName -match '\\x64\\mt\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $mt) { throw "Windows manifest tool mt.exe was not found" }
          & $mt.FullName -nologo -manifest windows-test.manifest -outputresource:"$($testExe.FullName);#1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $testExe.FullName
          exit $LASTEXITCODE


      # Benchmark the complete native release build after the original tests.
      # Outputs are local CI artifacts; this workflow cannot publish a release.
      - name: Configure benchmark packaging
        run: node -e "require('node:fs').writeFileSync('apps/desktop/src-tauri/fleet-benchmark.json',JSON.stringify({bundle:{useLocalToolsDir:true,createUpdaterArtifacts:false}}))"

      - name: Prepare fresh installer output inside the persistent target
        shell: node {0}
        run: |
          const fs = require('node:fs'), path = require('node:path');
          const root = process.env.FLEET_CACHE_ROOT;
          if (!root || !path.isAbsolute(root)) throw new Error('Cache root is missing');
          const expected = path.resolve(root, 'cargo-target', 'release', 'bundle');
          const actual = path.resolve(process.env.CARGO_TARGET_DIR, 'release', 'bundle');
          if (actual !== expected) throw new Error('Installer directory escaped cache target');
          if (fs.existsSync(actual)) {
            if (fs.realpathSync(actual) !== actual) throw new Error('Unexpected installer directory link');
            fs.rmSync(actual, {recursive:true});
          }
          console.log('Fresh installer output; compiled dependencies retained');

      - name: Full Windows release build and installers
        if: runner.os == 'Windows'
        run: pnpm --filter desktop exec tauri build --config src-tauri/fleet-benchmark.json --bundles msi,nsis

      - name: Full Intel Mac release build and packages
        if: runner.os == 'macOS'
        run: pnpm --filter desktop exec tauri build --config src-tauri/fleet-benchmark.json --bundles app,dmg

      - name: Retain Windows benchmark installers
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: fleet-full-build-windows-x64-${{ github.run_id }}
          path: |
            ${{ env.CARGO_TARGET_DIR }}/release/bundle/msi/*.msi
            ${{ env.CARGO_TARGET_DIR }}/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 7

      - name: Retain Intel Mac benchmark package
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: fleet-full-build-macos-x64-${{ github.run_id }}
          path: ${{ env.CARGO_TARGET_DIR }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7
