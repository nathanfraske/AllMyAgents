name: clean-machine install

# Does the SHIPPED app start its hub on a machine that is not a developer's?
#
# We already have a macOS installability job, and it passes. It also launched the app binary from a CI
# shell, which inherits the runner's developer environment: node, npm, git, python and a full PATH. Two
# real testers — one macOS, one Windows — installed the same release and got no hub. So the passing test
# was measuring the wrong machine.
#
# THE ONE THING THIS JOB DOES DIFFERENTLY: it scrubs PATH down to what a GUI-launched app actually gets
# before starting anything. On macOS, launchd hands a Finder-launched app roughly /usr/bin:/bin:/usr/sbin:
# /sbin — not the user's shell PATH. On Windows an Explorer-launched process gets the system PATH without
# whatever a dev shell added. If the hub only spawns when a toolchain happens to be on PATH, that is the
# bug, and this is the job that shows it.
#
# It also CAPTURES STDERR TO A FILE and always uploads it. The shell has ten eprintln! diagnostics and
# writes no log anywhere, so on a real user's machine every one of them is discarded — which is why two
# failures produced no information. Here they become an artifact.
#
# This job is expected to FAIL until the spawn bug is fixed. That is the point: it is a reproduction
# first and a regression test afterwards.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to install (blank = latest)'
        required: false
        default: ''
      source:
        description: 'Build the MSI from this commit instead of installing a release'
        required: false
        default: 'false'
  schedule:
    - cron: '41 5 * * *'

permissions:
  contents: read

concurrency:
  group: clean-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: clean macOS (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v4

      - name: Install from the release, exactly as a user would
        env:
          AMA_TAG: ${{ github.event.inputs.tag }}
        run: bash scripts/install-macos.sh

      # Everything above may use the runner's tools. Everything below must not.
      - name: Launch with a GUI-equivalent environment
        id: launch
        run: |
          set -uo pipefail
          APP=/Applications/AllMyAgents.app
          EXE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")"

          echo "--- what a dev shell has that a GUI launch does not ---"
          echo "shell PATH: $PATH"
          command -v node npm git || true

          # A Finder-launched app does not get the user's shell PATH. Reproduce that.
          CLEAN_PATH=/usr/bin:/bin:/usr/sbin:/sbin
          echo "launching with PATH=$CLEAN_PATH"

          env -i \
            HOME="$HOME" \
            PATH="$CLEAN_PATH" \
            TMPDIR="${TMPDIR:-/tmp}" \
            "$APP/Contents/MacOS/$EXE" > /tmp/ama-out.log 2> /tmp/ama-err.log &
          APP_PID=$!

          ok=0
          for i in $(seq 1 150); do
            if ! kill -0 "$APP_PID" 2>/dev/null; then echo "::warning::app process exited after ~$((i*2))s"; break; fi
            if curl -fsS --max-time 3 http://127.0.0.1:7777/api/health -o /tmp/health.json 2>/dev/null; then ok=1; break; fi
            sleep 2
          done

          echo "=== [desktop] diagnostics (the ones a real user never sees) ==="
          cat /tmp/ama-err.log || true
          cat /tmp/ama-out.log || true

          kill "$APP_PID" 2>/dev/null || true
          if [ "$ok" != 1 ]; then
            echo "::error::REPRODUCED — the hub never came up with a GUI-equivalent PATH. Diagnostics above."
            exit 1
          fi
          echo "hub answered: $(cat /tmp/health.json)"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-macos-${{ matrix.runner }}
          path: |
            /tmp/ama-out.log
            /tmp/ama-err.log
            /tmp/health.json
          if-no-files-found: warn

  windows:
    name: clean Windows
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # Building here rather than only testing a published MSI is what lets a FIX be verified before it
      # ships. Without it the loop is "cut a release, hope, ask a tester" — which is how a Windows-only
      # path bug survived a release in the first place.
      - name: Install toolchain (source build)
        if: github.event.inputs.source == 'true'
        uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        if: github.event.inputs.source == 'true'
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        if: github.event.inputs.source == 'true'
      - uses: swatinem/rust-cache@v2
        if: github.event.inputs.source == 'true'
        with:
          workspaces: 'apps/desktop/src-tauri -> target'

      - name: Build the MSI from this commit
        if: github.event.inputs.source == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm install --frozen-lockfile
          pnpm --filter desktop exec tauri build --bundles msi --config '{"bundle":{"createUpdaterArtifacts":false}}'
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item apps\desktop\src-tauri\target\release\bundle\msi\*.msi artifacts\

      - name: Download and silently install the MSI
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AMA_TAG: ${{ github.event.inputs.tag }}
          AMA_SOURCE: ${{ github.event.inputs.source }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:AMA_SOURCE -ne 'true') {
            $tag = $env:AMA_TAG
            if ([string]::IsNullOrWhiteSpace($tag)) {
              $tag = (gh release view --repo $env:GITHUB_REPOSITORY --json tagName -q .tagName)
            }
            Write-Host "installing published $tag"
            New-Item -ItemType Directory -Force artifacts | Out-Null
            gh release download $tag --repo $env:GITHUB_REPOSITORY -p '*.msi' -D artifacts --clobber
          } else {
            Write-Host "installing the MSI built from this commit"
          }
          $msi = (Get-ChildItem artifacts\*.msi | Select-Object -First 1).FullName
          Write-Host "msi: $msi"
          # Per-user install, silent, with a verbose MSI log — the same path the installer UI takes.
          $p = Start-Process msiexec.exe -ArgumentList @('/i', "`"$msi`"", '/qn', '/l*v', 'C:\msi.log') -Wait -PassThru
          Write-Host "msiexec exit: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { Get-Content C:\msi.log -Tail 60; throw "msiexec failed" }

      - name: Launch with a GUI-equivalent environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          # The installed binary is named for the CRATE (allmyagents-desktop.exe), not for productName —
          # there is no mainBinaryName in tauri.conf.json. Searching for AllMyAgents.exe found nothing and
          # reported it as an install failure, which is the same productName-vs-crate-name trap that made
          # scripts/desktop-smoke.mjs silently skip the real bundle on macOS. Accept either, and if neither
          # is present, LIST what actually landed rather than asserting absence.
          $roots = @("$env:LOCALAPPDATA\Programs", "$env:ProgramFiles", "${env:ProgramFiles(x86)}") |
                     Where-Object { $_ -and (Test-Path $_) }
          $exe = Get-ChildItem -Path $roots -Include 'allmyagents-desktop.exe','AllMyAgents.exe' `
                   -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) {
            Write-Host '::error::no AllMyAgents binary found after install. What the MSI actually placed:'
            foreach ($r in $roots) {
              Get-ChildItem -Path $r -Filter '*llmy*' -Recurse -Depth 3 -ErrorAction SilentlyContinue |
                Select-Object -First 40 | ForEach-Object { Write-Host "  $($_.FullName)" }
            }
            Write-Host '--- msiexec INSTALL/TARGETDIR lines ---'
            Select-String -Path C:\msi.log -Pattern 'INSTALLDIR|TARGETDIR|Installing file|Product:' -ErrorAction SilentlyContinue |
              Select-Object -First 25 | ForEach-Object { Write-Host "  $($_.Line.Trim())" }
            exit 1
          }
          Write-Host "exe: $($exe.FullName)"

          Write-Host "--- what a dev shell has that an Explorer launch does not ---"
          foreach ($t in 'node','npm','git') {
            $c = Get-Command $t -ErrorAction SilentlyContinue
            Write-Host ("  {0}: {1}" -f $t, $(if ($c) { $c.Source } else { '(absent)' }))
          }

          # An Explorer-launched process does not inherit a dev shell's PATH additions. Reproduce that.
          $clean = "$env:SystemRoot\system32;$env:SystemRoot;$env:SystemRoot\system32\Wbem"
          Write-Host "launching with PATH=$clean"
          $env:PATH = $clean

          $p = Start-Process -FilePath $exe.FullName -PassThru `
                 -RedirectStandardOutput C:\ama-out.log -RedirectStandardError C:\ama-err.log
          $ok = $false
          foreach ($i in 1..150) {
            if ($p.HasExited) { Write-Host "::warning::app exited after ~$($i*2)s (code $($p.ExitCode))"; break }
            try {
              Invoke-WebRequest -Uri http://127.0.0.1:7777/api/health -TimeoutSec 3 -UseBasicParsing -OutFile C:\health.json
              $ok = $true; break
            } catch { Start-Sleep -Seconds 2 }
          }

          Write-Host "=== [desktop] diagnostics (the ones a real user never sees) ==="
          if (Test-Path C:\ama-err.log) { Get-Content C:\ama-err.log }
          if (Test-Path C:\ama-out.log) { Get-Content C:\ama-out.log }

          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          if (-not $ok) {
            Write-Host '::error::REPRODUCED — the hub never came up with an Explorer-equivalent PATH. Diagnostics above.'
            exit 1
          }
          Write-Host "hub answered: $(Get-Content C:\health.json -Raw)"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-windows
          path: |
            C:\ama-out.log
            C:\ama-err.log
            C:\health.json
            C:\msi.log
          if-no-files-found: warn
