name: Release

# Build + sign the desktop installers for Windows and macOS on a version tag, generate the Tauri v2
# updater artifacts + latest.json, and attach everything to a GitHub PRE-release.
#
# ─────────────────────────────────────────────────────────────────────────────────────────────────
#  ⚠️ OPERATOR SETUP #1 — the UPDATER signing keypair (required; a key, not a server)
#
#  1. Generate a minisign keypair with the Tauri CLI (run once, locally, keep the private key secret):
#
#         pnpm --filter desktop exec tauri signer generate -w ./ama-updater.key
#       (or:  npx @tauri-apps/cli signer generate -w ./ama-updater.key )
#
#     It prints a PUBLIC KEY and writes the PRIVATE KEY to ./ama-updater.key (protected by the
#     password you choose). NEVER commit either file — move both out of the repo immediately.
#
#  2. Paste the PUBLIC KEY into apps/desktop/src-tauri/tauri.conf.json → plugins.updater.pubkey
#     (replacing the PASTE_TAURI_MINISIGN_PUBLIC_KEY_HERE placeholder) AND flip
#     bundle.createUpdaterArtifacts from false to true in the same file. The public key is safe to
#     commit — the updater uses it to verify an update's signature before installing it.
#
#     WHY createUpdaterArtifacts ships as `false`: with it true, `tauri build` FAILS unless a private
#     signing key is present in the environment. Leaving it false keeps a plain local
#     `pnpm desktop:build` working for anyone with a checkout and no key; flipping it is a one-line,
#     one-time change the operator makes when the keypair exists.
#
#  3. Add two GitHub Actions repository secrets (Settings → Secrets and variables → Actions):
#         TAURI_SIGNING_PRIVATE_KEY           = the full contents of ama-updater.key
#         TAURI_SIGNING_PRIVATE_KEY_PASSWORD  = the password you set in step 1 (empty string if none)
#     These are the CI secret PLACEHOLDERS referenced below — this workflow contains no key.
#
#  Losing the private key means no existing install can ever be updated again. Back it up.
#
# ─────────────────────────────────────────────────────────────────────────────────────────────────
#  ⚠️ OPERATOR SETUP #2 — macOS CODE SIGNING + NOTARIZATION (optional; needed for a clean install)
#
#  Without this the .app/.dmg is UNSIGNED: Gatekeeper quarantines it and the user must right-click →
#  Open (or `xattr -dr com.apple.quarantine /Applications/AllMyAgents.app`) on first launch. The
#  build below still succeeds without any of these secrets, because the "Export signing secrets that
#  are set" step forwards each APPLE_* var only when it is non-empty, leaving it ABSENT otherwise.
#  That distinction is load-bearing: an unset secret expands to an empty string, tauri only checks
#  whether APPLE_CERTIFICATE is present, and an empty certificate makes `security import` fail — which
#  is exactly how the v0.1.0-alpha.1 macOS release died. Empty is not the same as absent.
#
#  It requires a paid Apple Developer Program membership ($99/yr) — an operator purchase decision.
#  Once you have one:
#
#  a. Create a "Developer ID Application" certificate in the Apple Developer portal, download it,
#     and export it from Keychain Access as a .p12 with a password. Then base64 it:
#         base64 -i DeveloperIDApplication.p12 | pbcopy
#     Repository secrets:
#         APPLE_CERTIFICATE           = that base64 blob
#         APPLE_CERTIFICATE_PASSWORD  = the .p12 export password
#         KEYCHAIN_PASSWORD           = any random string (a throwaway CI keychain password)
#         APPLE_SIGNING_IDENTITY      = "Developer ID Application: <YOUR NAME> (<TEAMID>)"
#                                       — exactly as `security find-identity -v -p codesigning` prints it
#
#  b. For NOTARIZATION (what actually silences Gatekeeper), create an app-specific password at
#     appleid.apple.com → Sign-In and Security → App-Specific Passwords. Repository secrets:
#         APPLE_ID       = your Apple ID email
#         APPLE_PASSWORD = that app-specific password (NOT your Apple ID password)
#         APPLE_TEAM_ID  = your 10-character team id (Apple Developer → Membership)
#
#  c. Set "signingIdentity" in apps/desktop/src-tauri/tauri.conf.json → bundle.macOS to the same
#     string as APPLE_SIGNING_IDENTITY, or leave it unset and rely on the env var alone.
#
#  d. NOTE — the installer embeds a Node binary (scripts/bundle-hub.mjs stages it as a Tauri
#     resource). A signed .app must have every embedded Mach-O signed too, and hardened runtime +
#     notarization may need entitlements for it. If notarization rejects the bundle over the
#     embedded `node`, add an entitlements plist (com.apple.security.cs.allow-jit and
#     com.apple.security.cs.allow-unsigned-executable-memory are the usual pair for a JS runtime)
#     and point bundle.macOS.entitlements at it. This has NOT been exercised — see the "Known gaps"
#     section of docs/alpha-cut-checklist.md.
#
#  ⚠️ Windows Authenticode signing is a separate, also-unset decision: without it SmartScreen warns
#     on first run. Tauri reads WINDOWS_CERTIFICATE / WINDOWS_CERTIFICATE_PASSWORD the same way.
#
# ─────────────────────────────────────────────────────────────────────────────────────────────────
#  NOTE on the updater endpoint: tauri.conf.json points at
#    .../releases/latest/download/latest.json
#  GitHub's `/releases/latest` resolves to the newest NON-prerelease. While every alpha is a
#  pre-release there is no "latest" for it to resolve to, so either (a) promote one release out of
#  pre-release, or (b) temporarily point the endpoint at the per-tag URL
#  .../releases/download/<tag>/latest.json until a stable release exists.
#  See docs/alpha-cut-checklist.md step 9.
# ─────────────────────────────────────────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - 'v*'

# tauri-action creates the GitHub Release and uploads the installers/updater assets to it.
permissions:
  contents: write
  actions: write

# A re-pushed tag should not race a run already publishing to the same release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  launch-and-repair-gate:
    name: installed launch-and-repair gate
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch exact-tag durability verification and wait for both platforms
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/wait-release-verification.mjs

  release:
    name: build (${{ matrix.platform }})
    needs: launch-and-repair-gate
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The two release runners. Each builds for its OWN host arch, and that is load-bearing:
        # scripts/bundle-hub.mjs ships the RUNNER'S Node binary inside the app, so the app arch and
        # the bundled Node arch must match. That is also why we do NOT build a universal macOS binary
        # (`--target universal-apple-darwin`) — the app would be universal but carry an arm64-only
        # Node, and Rosetta would not save it.
        #
        # macos-latest is Apple Silicon (macos-26-arm64 as of this writing). `macos-15-intel` covers
        # Intel Macs — until it was added, an Intel tester downloading the only DMG got "you can't open
        # the application because it is not supported on this type of Mac", and no amount of Gatekeeper
        # workaround helps that.
        #
        # It is NOT `macos-13`, which this comment used to recommend: GitHub retired that image on
        # 2025-12-04, so following the old advice produced an unresolvable runner label. macos-15-intel
        # is the surviving x86_64 host and is scheduled to last until August 2027.
        platform: [macos-latest, macos-15-intel, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Cache the Rust build of the Tauri app (the crate lives under apps/desktop/src-tauri).
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'apps/desktop/src-tauri -> target'

      # Installs all workspaces. tauri.conf.json's beforeBuildCommand then builds the web UI and runs
      # `hub:bundle` (which stages this runner's Node + the compiled hub as Tauri resources).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Prove the bundle's credential firewall still fires BEFORE we build anything. This is the
      # landmine guard from docs/alpha-release-plan.md; the real audit then runs inside hub:bundle
      # (invoked by tauri.conf.json's beforeBuildCommand) and fails the build on any leak.
      - name: Credential-firewall self-test
        run: pnpm run bundle:audit

      - name: Load the versioned feature and fix log
        id: release_notes
        run: node scripts/release-notes-output.mjs "${{ github.ref_name }}"

      # A release whose installers carry no updater artifacts cannot ever auto-update the fleet, and
      # that is silent otherwise — you only find out when alpha.2 never reaches anyone. Warn loudly
      # (not fatal: an operator may deliberately cut an unsigned smoke-test build).
      - name: Warn if the updater signing key is missing
        shell: bash
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::warning title=No updater signing key::TAURI_SIGNING_PRIVATE_KEY is not set. This release will ship installers with NO signed updater artifacts and NO latest.json, so no installed build can auto-update from it. See the OPERATOR SETUP #1 header in .github/workflows/release.yml."
          fi

      # REFUSE TO PUBLISH A RELEASE NOBODY CAN RECEIVE.
      #
      # The Tauri updater compares the `version` field in latest.json against the INSTALLED app version.
      # It does not look at the git tag. So cutting `v0.1.4-alpha.6` while tauri.conf.json still says
      # "0.1.4" produces a release that every installed 0.1.4 client evaluates as "same version, nothing
      # to do" — and is offered nothing, forever. Nothing errors. The release page looks perfect. The
      # fleet simply never moves, and you find out weeks later when a fix you shipped is missing.
      #
      # This already nearly happened: alpha.5 published 0.1.4, and the next cut would have published
      # 0.1.4 again. The release body has said "provided the app version increases" since day one, which
      # documents the requirement without enforcing it — and a documented invariant with no guard is a
      # convention, not an invariant.
      #
      # Fatal rather than a warning, unlike the signing-key check above. An unsigned smoke build is a
      # thing an operator may genuinely want; a release the fleet cannot see is never the goal. Set the
      # repo variable ALLOW_NON_INCREASING_VERSION=1 to override — the guard is escapable, not absolute.
      - name: Refuse a non-increasing app version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          ALLOW: ${{ vars.ALLOW_NON_INCREASING_VERSION }}
        run: |
          NEW=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          CARGO=$(node -e "const fs=require('fs');const m=fs.readFileSync('apps/desktop/src-tauri/Cargo.toml','utf8').match(/^version = \"([^\"]+)\"/m);console.log(m?m[1]:'')")
          echo "tauri.conf.json : $NEW"
          echo "Cargo.toml      : $CARGO"
          echo "tag             : $TAG"

          # A split version is its own silent failure: the bundle takes one and the binary reports the other.
          if [ "$NEW" != "$CARGO" ]; then
            echo "::error title=Version mismatch::tauri.conf.json says '$NEW' but Cargo.toml says '$CARGO'. They must match."
            exit 1
          fi

          # The tag is what humans read; the version is what the updater obeys. If they disagree, whoever
          # cut the release believes something false about what it will do.
          case "$TAG" in
            v"$NEW"|v"$NEW"-*) ;;
            *)
              echo "::error title=Tag does not match version::Tag '$TAG' does not correspond to app version '$NEW'. Expected v$NEW or v$NEW-<suffix>."
              exit 1 ;;
          esac

          PUB=$(curl -sSfL --max-time 30 "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest.json" 2>/dev/null \
                | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).version||'')}catch{console.log('')}})" || true)

          if [ -z "$PUB" ]; then
            echo "No published latest.json yet — first signed release, nothing to compare against."
            exit 0
          fi
          echo "currently published: $PUB"

          # Strict greater-than. Equal is the exact failure this guard exists for, so equal must fail.
          if node -e "
            const cmp=(a,b)=>{const p=s=>s.split('-')[0].split('.').map(Number);const[x,y]=[p(a),p(b)];
            for(let i=0;i<3;i++){if((x[i]||0)!==(y[i]||0))return (x[i]||0)>(y[i]||0)?1:-1}return 0};
            process.exit(cmp(process.argv[1],process.argv[2])>0?0:1)" "$NEW" "$PUB"; then
            echo "OK: $NEW > $PUB — installed clients will be offered this update."
          else
            if [ "$ALLOW" = "1" ]; then
              echo "::warning title=Non-increasing version allowed::$NEW is not greater than published $PUB, but ALLOW_NON_INCREASING_VERSION=1. Installed clients will NOT auto-update to this release."
            else
              echo "::error title=Version would not reach the fleet::App version '$NEW' is not greater than the currently published '$PUB'. The Tauri updater compares this field, NOT the git tag, so every installed client would see no update and stay where it is. Bump the version in apps/desktop/src-tauri/tauri.conf.json AND Cargo.toml, then re-tag. To publish anyway, set repo variable ALLOW_NON_INCREASING_VERSION=1."
              exit 1
            fi
          fi

      # Forward ONLY the signing secrets that actually exist.
      #
      # This step is here because of a real failure. The signing vars used to be listed directly in the
      # tauri-action `env:` block below, on the assumption that an unset secret expands to "" and that
      # empty means "skip signing". It does not. An unset secret still DEFINES the variable (as an empty
      # string), tauri-bundler only checks whether APPLE_CERTIFICATE is *present*, and so the macOS job
      # ran `security import` on an empty certificate and died:
      #
      #     security: SecKeychainItemImport: One or more parameters passed to a function were not valid.
      #     failed to bundle project: failed codesign application: failed to import keychain certificate
      #
      # That killed the whole v0.1.0-alpha.1 release even though the .app had already built and bundled
      # fine (Windows published; macOS did not). "Defined but empty" != "absent" — so we copy each secret
      # into the job environment only when it is non-empty, and leave it genuinely ABSENT otherwise.
      # Absent is the state tauri actually treats as "skip", which is what an unsigned alpha needs.
      - name: Export signing secrets that are set
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          forward() {
            local name="$1"
            local value="${!name-}"
            if [ -z "$value" ]; then
              echo "skip $name (not set)"
              return 0
            fi
            # Heredoc form: signing keys are multi-line. Random delimiter so a secret cannot smuggle
            # its own terminator and inject arbitrary environment.
            local eof="AMA_EOF_${RANDOM}${RANDOM}"
            {
              echo "${name}<<${eof}"
              echo "$value"
              echo "$eof"
            } >> "$GITHUB_ENV"
            echo "forward $name (set)"
          }
          for name in \
            TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD \
            APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY KEYCHAIN_PASSWORD \
            APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID \
            WINDOWS_CERTIFICATE WINDOWS_CERTIFICATE_PASSWORD; do
            forward "$name"
          done

          # AD-HOC SIGN macOS WHEN THERE IS NO DEVELOPER ID. Without this the shipped .app has no
          # _CodeSignature at all — only the ad-hoc signature `ld64` stamps on the main executable so it
          # can run — and Gatekeeper refuses a quarantined bundle with no resource seal as "damaged and
          # can't be opened". That message is a dead end: it offers no override, and the "right-click and
          # choose Open" escape everyone still recommends was removed in macOS 15 Sequoia. Testers
          # correctly reported the app simply would not install.
          #
          # `codesign -s -` seals the bundle without any certificate. It does NOT make Gatekeeper happy —
          # only notarization does that, which needs a paid Developer ID — but it changes the refusal from
          # "damaged" to "Apple could not verify…", which DOES expose an Open Anyway button in System
          # Settings, and it makes the documented `xattr -dr` workaround behave predictably.
          #
          # Only when APPLE_SIGNING_IDENTITY is absent: a real identity forwarded above must always win.
          if [ "$RUNNER_OS" = macOS ] && [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "no Developer ID — falling back to ad-hoc signing (-)"
          fi

      # tauri-action runs `tauri build` in apps/desktop: builds the installers (Windows .msi + NSIS,
      # macOS .app + .dmg — tauri.conf.json's `targets` list is filtered per host OS), and, once
      # bundle.createUpdaterArtifacts is true and the signing key is present, also emits the SIGNED
      # updater artifacts and (with includeUpdaterJson) the latest.json manifest — all uploaded to a
      # GitHub pre-release.
      - name: Build, sign, and publish (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The signing vars (OPERATOR SETUP #1 and #2) are deliberately NOT listed here. They are
          # exported by the step above, and only when the corresponding secret is actually set. Do not
          # add them back: a step-level `env:` entry wins over the job environment, so re-listing one
          # would define it as an empty string again and resurrect the codesign failure described above.
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'AllMyAgents ${{ github.ref_name }}'
          releaseBody: ${{ steps.release_notes.outputs.body }}
          # NOT a prerelease, deliberately, even though these are alphas.
          #
          # tauri.conf.json points the updater at
          #     https://github.com/nathanfraske/AllMyAgents/releases/latest/download/latest.json
          # and GitHub's /releases/latest EXCLUDES prereleases. While every release was flagged
          # prerelease, that endpoint resolved to nothing at all (there had never been a non-prerelease
          # release), so no installed build could discover any update — while the release notes promised
          # auto-update. GitHub also refuses `make_latest` on a prerelease, so "prerelease but still
          # latest" is not an available configuration.
          #
          # So the choice is: publish as a normal release, or have no working updater. We publish as a
          # normal release and carry the alpha warning in the release name and body instead.
          # If you ever set this back to true, change the updater endpoint in the same commit.
          prerelease: false
          includeUpdaterJson: true
