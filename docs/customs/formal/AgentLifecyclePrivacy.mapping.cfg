SPECIFICATION MappingHarnessSpec

CONSTANTS
    AgentIds = {agent0, agent1}
    Names = {name0, name1}
    ProjectIds = {project0}
    ProjectPrincipals = {principal0, principal1}
    DraftIds = {draft0}
    NormBodies = {body0}
    PermissionAtoms = {inferPermission}
    CustomIds = {custom0}
    CapsuleIds = {capsule0}
    ProjectAuthorities = {projectAuthority0}
    AgentAuthorities = {agentAuthority0, agentAuthority1}
    InitialAgent = agent0
    InitialName = name0
    InitialProject = project0
    InitialPrincipal = principal0
    InitialProjectAuthority = projectAuthority0
    InitialAgentAuthority = agentAuthority0
    NoAgent = noAgent
    NoName = noName
    NoProject = noProject
    NoPrincipal = noPrincipal
    NoDraft = noDraft
    NoBody = noBody
    NoKind = noKind
    NoCustom = noCustom
    NoAuthority = noAuthority
    NoMode = noMode

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    UniqueReadableNames
    PrivateMapIsProjectLocalBijection
    OverlayOnlyMappedOwner
    MissingAmbiguousOrErasedMapFailsClosed
    RetirementErasesMapping

PROPERTIES
    FailClosedAttemptsDoNotActivate
    RetiredAgentIdsAreNeverReused
    ConditionalMappingReviewLiveness
