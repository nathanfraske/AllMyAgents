SPECIFICATION Spec

CONSTANTS
    AgentIds = {agent0, agent1}
    Names = {name0, name1}
    ProjectIds = {project0, project1}
    ProjectPrincipals = {principal0, principal1}
    DraftIds = {draft0, draft1}
    NormBodies = {body0, body1}
    PermissionAtoms = {inferPermission, effectPermission, releasePermission}
    CustomIds = {custom0, custom1}
    CapsuleIds = {capsule0, capsule1}
    ProjectAuthorities = {projectAuthority0, projectAuthority1}
    AgentAuthorities = {agentAuthority0, agentAuthority1}
    InitialAgent = agent0
    InitialName = name0
    InitialProject = project0
    InitialPrincipal = principal0
    InitialProjectAuthority = projectAuthority0
    InitialAgentAuthority = agentAuthority0
    NoAgent = noAgent
    NoName = noName
    NoProject = noProject
    NoPrincipal = noPrincipal
    NoDraft = noDraft
    NoBody = noBody
    NoKind = noKind
    NoCustom = noCustom
    NoAuthority = noAuthority
    NoMode = noMode

INVARIANTS
    TypeOK
    UniqueReadableNames
    PrivateMapIsProjectLocalBijection
    ExactlyOneNormBodyPerImmutableDraft
    SelfAdoptionIsExplicitAndNonWidening
    OverlayOnlyMappedOwner
    AuthorshipNeverActivates
    PromotionCannotReuseAgentAuthority
    ImportsRemainInactiveUntilReview
    MissingAmbiguousOrErasedMapFailsClosed
    RetirementErasesMapping
    CapsulesExcludeAgentId

PROPERTIES
    DraftsAreImmutable
    FailClosedAttemptsDoNotActivate
    RetiredAgentIdsAreNeverReused
    ConditionalPromotionLiveness
    ConditionalMappingReviewLiveness
    ConditionalDraftReviewLiveness
