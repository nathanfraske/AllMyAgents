SPECIFICATION Spec

CONSTANTS
    RequestIds = {request0, request1, request2}
    SessionIds = {session0}
    SessionIncarnations = {incarnation0, incarnation1}
    EnforcerGenerations = {generation0, generation1}
    PolicyDigests = {policy0, policy1, policy2}
    GrantIds = {grant0, grant1}
    DeviationGrantIds = {deviation0, deviation1}
    Workers = {worker0, worker1}
    GrantEpochs = {0, 1, 2}
    RetryCounts = {0, 1, 2}
    HigherConstraint = {inference, effect, outputRelease}
    InferenceTarget = inference
    EffectTarget = effect
    OutputReleaseTarget = outputRelease
    InitialPolicyDigest = policy0
    InitialSessionIncarnation = incarnation0
    InitialEnforcerGeneration = generation0
    InitialPolicyCeiling = {inference, effect, outputRelease}
    ZeroGrantEpoch = 0
    ZeroRetryCount = 0
    CanonicalRenderer = renderer0
    NoRequest = noRequest
    NoGrant = noGrant
    NoPolicy = noPolicy
    NoCharter = noCharter
    NoManifest = noManifest
    NoOutcome = noOutcome
    UnknownOutcome = unknownOutcome
    SuccessOutcome = successOutcome
    FailureOutcome = failureOutcome

INVARIANTS
    TypeOK
    NoActionWithoutMatchingAdmission
    AtomicAdmissionAndOutcome
    AtMostOneLocalGatewaySend
    AtMostOneAuthoritativeEnqueue
    DecisionRecordsAreNonAuthorizing
    PolicyBasisIsDeviationFree
    ExactDeviationGrants
    SemanticAndRenderArtifactsAreSeparate
    SessionGrantIsSolePositiveAuthority
    TypedGatewayTargets

PROPERTIES
    AdmissionLinearizesAtCurrentState
    HeadOrGrantChangeBlocksStaleDownstream
    NoCachedAllowSurvivesDelay
    LowerLayersNeverWiden
    ConditionalGatewayLiveness
    ConditionalInferenceCompletion
    ConditionalEffectReconciliation
